<!doctype html><html><head><meta charset="utf-8"><title>Holodori 3★–5★ reference refresher</title>
<style>body{font:14px system-ui;background:#081b3c;color:#eef5ff;max-width:900px;margin:30px auto;padding:0 18px}button{padding:10px 14px}.bar{height:12px;background:#18345d;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#5fa7ff;width:0}pre{white-space:pre-wrap;background:#06142d;padding:12px;border-radius:8px;max-height:420px;overflow:auto}</style></head><body>
<h1>Holodori automatic 3★–5★ reference refresh</h1>
<p>This helper reads the live HolodoriDB Card.json, discovers all 3★/4★/5★ cards, and downloads their portrait references. There is no embedded card list, so future card releases require only running this refresh again.</p>
<button id="go">Discover cards and build cache</button><p id="status">Idle.</p><div class="bar"><i id="bar"></i></div><pre id="log"></pre>
<script>
const CARD_DB='https://raw.githubusercontent.com/HolodoriDB/holodori-db-eng-diff/main/Card.json';
const ASSET_BASE='https://api.holodori.best/api/asset/assetbundles/';
const enc=new TextEncoder(), log=s=>{const e=document.getElementById('log');e.textContent+=s+'\n';e.scrollTop=e.scrollHeight};
function rarityOf(v){const m=String(v||'').match(/RARITY_(\d+)$/);return m?Number(m[1]):0}
function portrait(asset){const stem=`img_card_vert_${asset}`;return `${ASSET_BASE}${stem}/${stem}.webp`}
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0);}return (c^0xffffffff)>>>0;}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function cat(parts){let n=parts.reduce((a,b)=>a+b.length,0),o=new Uint8Array(n),p=0;for(const b of parts){o.set(b,p);p+=b.length}return o;}
function zipStore(files){let local=[],central=[],offset=0;for(const f of files){const name=enc.encode(f.name),data=f.data,crc=crc32(data);const lh=cat([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);local.push(lh);const ch=cat([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);central.push(ch);offset+=lh.length;}const body=cat(local),cd=cat(central),end=cat([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cd.length),u32(body.length),u16(0)]);return cat([body,cd,end]);}
async function discover(){const r=await fetch(CARD_DB,{cache:'no-cache'});if(!r.ok)throw Error(`Card.json ${r.status}`);const db=await r.json();const cards=[];for(const row of db){const d=row.data||row, rarity=rarityOf(d.rarity);if(![3,4,5].includes(rarity)||!d.id||!d.assetId)continue;cards.push({id:String(d.id),assetId:String(d.assetId),characterId:String(d.characterId||''),member:'',name:'',rarity,attributeId:String(d.attributeType||''),groupIds:[]});}cards.sort((a,b)=>b.rarity-a.rarity||a.id.localeCompare(b.id));return cards;}
document.getElementById('go').onclick=async()=>{const btn=document.getElementById('go');btn.disabled=true;const files=[],failed=[];try{document.getElementById('status').textContent='Discovering live Card.json…';const cards=await discover();const counts={3:0,4:0,5:0};for(const c of cards)counts[c.rarity]++;log(`Discovered ${cards.length} cards: 5★=${counts[5]}, 4★=${counts[4]}, 3★=${counts[3]}`);files.push({name:'cards_3to5.json',data:enc.encode(JSON.stringify(cards,null,2))});let next=0,done=0;const workers=Array.from({length:8},async()=>{while(true){const i=next++;if(i>=cards.length)return;const c=cards[i];try{const res=await fetch(portrait(c.assetId),{mode:'cors',cache:'no-cache'});if(!res.ok)throw Error(String(res.status));const data=new Uint8Array(await res.arrayBuffer());files.push({name:`img_card_vert_${c.assetId}.webp`,data});}catch(e){failed.push({cardId:c.id,assetId:c.assetId,error:String(e)});}done++;document.getElementById('bar').style.width=`${100*done/cards.length}%`;document.getElementById('status').textContent=`${done}/${cards.length} references`;if(done%20===0||done===cards.length)log(`Progress ${done}/${cards.length}, failed ${failed.length}`);}});await Promise.all(workers);files.push({name:'reference_refresh_report.json',data:enc.encode(JSON.stringify({schemaVersion:2,discovered:cards.length,rarityCounts:counts,downloaded:cards.length-failed.length,failed},null,2))});const blob=new Blob([zipStore(files)],{type:'application/zip'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='holodori_3to5_reference_cache.zip';a.click();document.getElementById('status').textContent=`Done: ${cards.length-failed.length}/${cards.length} portraits; ${failed.length} failed.`;}catch(e){log('ERROR '+e);document.getElementById('status').textContent='Failed: '+e;}finally{btn.disabled=false;}};
</script></body></html>
